<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kwara &amp; Dana Media</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="brand"><span class="brand-mark">K&amp;D<img src="images/kwara-dana.jpg" alt="" onerror="this.remove()"></span> Kwara &amp; Dana</a>
    <nav class="nav"></nav>
  </header>

  <main class="hero">
    <span class="eyebrow">Official</span>
    <h1 class="title">Welcome to <span class="title-line"><span class="grad">Kwara &amp; Dana</span> Media</span></h1>
    <p class="lead">Music, stories and sound — straight from the source. Press play and step inside.</p>

    <div class="video-frame">
      <div class="ratio">
        <iframe id="home-video" class="yt-video yt-bare" src="https://www.youtube-nocookie.com/embed/oWj7zgFu-50?enablejsapi=1&amp;controls=0&amp;fs=0&amp;disablekb=1&amp;iv_load_policy=3&amp;rel=0&amp;playsinline=1" title="Happy 60th" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <!-- Custom controls: YouTube's own UI (logo, copy link, Watch on YouTube) never receives hover/taps -->
        <div class="vc" data-vc="home-video">
          <button class="vc-hit" type="button" aria-label="Play / pause"></button>
          <div class="vc-bar">
            <button class="vc-btn vc-play" type="button" aria-label="Pause"></button>
            <span class="vc-time">0:00 / 0:00</span>
            <div class="vc-seek" role="slider" aria-label="Seek" tabindex="0"><i></i></div>
            <button class="vc-btn vc-mute" type="button" aria-label="Mute"></button>
            <button class="vc-btn vc-fs" type="button" aria-label="Full view"></button>
          </div>
        </div>
        <!-- Cover before play and while paused -->
        <button class="video-cover" type="button" data-cover="home-video" aria-label="Play Happy 60th"
                style="background-image: url(https://i.ytimg.com/vi/oWj7zgFu-50/maxresdefault.jpg)">
          <span class="cover-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span>
        </button>
      </div>
    </div>
    <button class="btn-full" type="button" data-fullview="home-video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      Full View
    </button>

    <div class="duo">
      <a href="kwara.html" class="k"><div><h3>Kwara</h3><span>Audio &amp; Video</span></div><span class="arrow">→</span></a>
      <a href="dana.html" class="d"><div><h3>Dana</h3><span>Audio &amp; Video</span></div><span class="arrow">→</span></a>
    </div>
  </main>

  <footer>© 2026 Kwara &amp; Dana Media. All rights reserved.</footer>

  <script src="script.js"></script>
</body>
</html>
